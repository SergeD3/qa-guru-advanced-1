[pytest]
addopts = -v --strict

markers =
  smoke: runs the smoke test suites
  regression: runs the regression test suites
  debug: runs tests marked as debug

pythonpath = .

log_cli = 1
log_cli_level = INFO
log_cli_format = %(levelname)-8s %(name)s:%(lineno)d - %(message)s
log_cli_date_format=%Y-%m-%d %H:%M:%S

log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)-8s] %(name)s:%(lineno)d [%(funcName)s] - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S